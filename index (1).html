<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clasificador de basura</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:16px;background:#f4f6f4;color:#1b2b1b}
  h1{font-size:1.3rem;margin:0 0 12px}
  .card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px #0002}
  input{width:100%;box-sizing:border-box;padding:10px;font-size:1rem;border:1px solid #bbb;border-radius:8px}
  button{width:100%;padding:12px;font-size:1rem;border:0;border-radius:8px;background:#2e7d32;color:#fff;margin-top:8px;cursor:pointer}
  button.sec{background:#1565c0}
  button:disabled{background:#999;cursor:default}
  #cam{width:100%;border-radius:8px;background:#000;min-height:200px;overflow:hidden}
  #cam canvas{width:100%!important;height:auto!important}
  #resultado{font-size:1.4rem;font-weight:bold;text-align:center;padding:10px}
  .org{color:#2e7d32}.inorg{color:#1565c0}
  #estado,#log{font-size:.9rem;color:#555}
  small{color:#666}
</style>
</head>
<body>
<h1>♻️ Clasificador orgánico / inorgánico</h1>

<div class="card">
  <label>URL de tu modelo de Teachable Machine <small>(vacío = modo prueba con MobileNet)</small></label>
  <input id="modelUrl" placeholder="https://teachablemachine.withgoogle.com/models/XXXXXXX/">
  <label style="display:block;margin-top:8px">Nombre de la clase orgánica <small>(solo con tu modelo)</small></label>
  <input id="claseOrg" value="Organico">
  <button id="btnCam">1) Iniciar cámara y clasificar</button>
  <button id="btnFlip" class="sec" disabled>🔄 Cambiar cámara (frontal / trasera)</button>
  <button id="btnBT" class="sec">2) Conectar Bluetooth (opcional)</button>
  <p id="estado">Bluetooth no conectado: el resultado solo se mostrará en pantalla</p>
</div>

<div class="card">
  <div id="cam"></div>
  <div id="resultado">—</div>
  <div id="detalle" style="text-align:center;font-size:.9rem"></div>
  <div id="log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.0.4/dist/mobilenet.min.js"></script>
<script>
const SERVICE = 0xFFE0, CHAR = 0xFFE1;   // módulo BLE tipo HM-10 / AT-09
let characteristic = null, tmModel = null, mnet = null, webcam, ultimo = null, estable = 0;
const UMBRAL = 0.85, UMBRAL_MOBILENET = 0.30, FRAMES_ESTABLES = 8;

// Palabras de ImageNet que se consideran orgánicas (solo para el modo prueba)
const ORGANICO = /banana|orange|lemon|apple|pineapple|strawberry|pomegranate|fig|jackfruit|custard|broccoli|cauliflower|cucumber|zucchini|artichoke|bell pepper|mushroom|corn|cabbage|squash|cardoon|bagel|pretzel|pizza|cheeseburger|hotdog|burrito|loaf|mashed potato|guacamole|ice cream|egg|potato|carbonara|trifle|plate|meat/i;

const $ = id => document.getElementById(id);
const estado = t => $('estado').textContent = t;

$('btnBT').onclick = async () => {
  try {
    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }],
      optionalServices: [SERVICE]
    });
    dev.addEventListener('gattserverdisconnected', () => { characteristic = null; estado('Bluetooth desconectado'); });
    const server = await dev.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE);
    characteristic = await svc.getCharacteristic(CHAR);
    estado('Bluetooth conectado a ' + (dev.name || 'dispositivo'));
  } catch (e) { estado('Error Bluetooth: ' + e.message); }
};

async function enviar(valor) {
  $('log').textContent = 'Último envío: ' + valor + (characteristic ? '' : ' (simulado, sin Bluetooth)');
  if (!characteristic) return;
  try { await characteristic.writeValue(new TextEncoder().encode(String(valor))); }
  catch (e) { estado('Error al enviar: ' + e.message); }
}

let tEnvio = 0, enviando = false;
async function enviarContinuo(valor) {          // un dato cada 250 ms
  const ahora = Date.now();
  if (enviando || ahora - tEnvio < 250) return;
  tEnvio = ahora; enviando = true;
  await enviar(valor);
  enviando = false;
}

$('btnCam').onclick = async () => {
  const base = $('modelUrl').value.trim();
  $('btnCam').disabled = true;
  estado('Cargando modelo...');
  try {
    if (base) {
      const url = base.endsWith('/') ? base : base + '/';
      tmModel = await tmImage.load(url + 'model.json', url + 'metadata.json');
    } else {
      mnet = await mobilenet.load();
    }
    await iniciarCamara();
    $('btnFlip').disabled = false;
    estado((characteristic ? 'Bluetooth conectado. ' : 'Sin Bluetooth. ') + (base ? 'Usando tu modelo.' : 'Modo prueba (MobileNet).'));
    requestAnimationFrame(loop);
  } catch (e) { estado('Error: ' + e.message); $('btnCam').disabled = false; }
};

let facing = 'environment', cambiando = false;   // arranca con la cámara trasera

async function iniciarCamara() {
  if (webcam) { try { webcam.stop(); } catch (e) {} webcam.canvas.remove(); }
  webcam = new tmImage.Webcam(400, 300, facing === 'user');   // espejo solo en la frontal
  await webcam.setup({ facingMode: facing });
  await webcam.play();
  $('cam').appendChild(webcam.canvas);
}

$('btnFlip').onclick = async () => {
  cambiando = true;
  facing = facing === 'user' ? 'environment' : 'user';
  try { await iniciarCamara(); }
  catch (e) { estado('Error al cambiar de cámara: ' + e.message); }
  cambiando = false;
};

async function clasificar() {
  if (tmModel) {
    const preds = await tmModel.predict(webcam.canvas);
    const mejor = preds.reduce((a, b) => a.probability > b.probability ? a : b);
    return {
      ok: mejor.probability >= UMBRAL,
      esOrg: mejor.className.toLowerCase() === $('claseOrg').value.trim().toLowerCase(),
      detalle: preds.map(p => p.className + ': ' + (p.probability * 100).toFixed(0) + '%').join('  |  ')
    };
  }
  const preds = await mnet.classify(webcam.canvas, 3);
  const top = preds[0];
  return {
    ok: top.probability >= UMBRAL_MOBILENET,
    esOrg: ORGANICO.test(top.className),
    detalle: preds.map(p => p.className.split(',')[0] + ' ' + (p.probability * 100).toFixed(0) + '%').join('  |  ')
  };
}

async function loop() {
  if (cambiando) { requestAnimationFrame(loop); return; }
  webcam.update();
  const r = await clasificar();
  $('detalle').textContent = r.detalle;

  if (r.ok) {
    const valor = r.esOrg ? 1 : 0;
    if (valor !== ultimo) { ultimo = valor; estable = 0; }
    estable++;
    $('resultado').textContent = r.esOrg ? 'ORGÁNICO → 1' : 'INORGÁNICO → 0';
    $('resultado').className = r.esOrg ? 'org' : 'inorg';
    if (estable >= FRAMES_ESTABLES) enviarContinuo(valor);   // manda el dato sin parar mientras sea estable
  } else {
    $('resultado').textContent = '—';
    estable = 0; ultimo = null;
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
